<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LocalDesk · Agent Execution Console</title>
  <style>
    :root{--navy:#07162f;--ink:#14213d;--muted:#64748b;--line:#dbe4f0;--panel:#fff;--canvas:#f3f6fb;--blue:#155eef;--cyan:#06b6d4;--green:#16a34a;--amber:#d97706;--red:#dc2626}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,"Segoe UI","PingFang SC",Arial,sans-serif}button{font:inherit}
    .topbar{background:linear-gradient(120deg,#07162f,#0b3474);color:#fff;padding:22px 34px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:13px}.mark{width:38px;height:38px;border:2px solid #5ee1ff;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#5ee1ff}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;margin:3px 0 0;color:#b8cae8}.truth{font-size:12px;color:#d5e5ff;border:1px solid #416493;border-radius:999px;padding:7px 12px}
    .shell{max-width:1480px;margin:0 auto;padding:24px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(20,33,61,.05)}.metric{padding:15px 18px}.metric b{font-size:22px;display:block}.metric span{font-size:12px;color:var(--muted)}
    .run-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.run-tab{border:1px solid #c9d5e6;background:#fff;color:#334155;padding:10px 16px;border-radius:999px;cursor:pointer}.run-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .hero{padding:22px 24px;margin-bottom:18px;display:grid;grid-template-columns:1fr auto;gap:24px}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero h2{font-size:28px;margin:8px 0}.hero .query{font-size:15px;color:#334155;margin:0}.status{align-self:start;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700}.succeeded{background:#dcfce7;color:#166534}.failed{background:#fee2e2;color:#991b1b}.awaiting_confirmation{background:#fef3c7;color:#92400e}.draft,.planned,.executing{background:#dbeafe;color:#1e40af}.mode-note{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    .stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}.stage{position:relative;background:#e8edf5;color:#64748b;padding:13px 12px;border-radius:12px;font-size:12px;font-weight:700}.stage.done{background:#e0f2fe;color:#075985}.stage.done:before{content:"✓";margin-right:6px}.stage.current{background:#dbeafe;color:#1d4ed8;box-shadow:inset 0 0 0 1px #93c5fd}
    .grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:18px}.panel{padding:20px}.panel h3{margin:0 0 14px;font-size:16px}.plan{margin:0;padding-left:22px;color:#334155}.plan li{padding:5px 0}.actions{display:grid;gap:9px}.action{border:1px solid var(--line);border-radius:12px;padding:11px 13px}.action-top{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700}.action small{display:block;color:var(--muted);margin-top:4px}.approval{margin-top:14px;border-left:4px solid var(--amber);background:#fff8eb;padding:12px 14px;border-radius:8px;font-size:13px}.approval.ok{border-left-color:var(--green);background:#f0fdf4}
    .artifacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.artifact{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.artifact .type{color:var(--blue);font-weight:800;font-size:12px;text-transform:uppercase}.artifact strong{display:block;margin:7px 0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artifact code{font-size:10px;color:var(--muted);word-break:break-all}.limitations{margin:12px 0 0;padding-left:18px;color:#92400e;font-size:12px}
    .trace-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:8px;font-size:11px;cursor:pointer}.filter.active{background:#e0ecff;border-color:#8ab3ff;color:#1d4ed8}.timeline{max-height:680px;overflow:auto;padding-right:4px}.event{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f6}.seq{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eaf0fa;color:#365278;font-size:11px;font-weight:800}.event-title{font-size:13px;font-weight:750}.event-time{font-size:10px;color:var(--muted);margin-top:3px}.event-summary{font-size:12px;color:#475569;margin-top:5px;line-height:1.5}.event details{margin-top:6px}.event summary{font-size:11px;color:var(--blue);cursor:pointer}.event pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:8px;padding:9px;font-size:10px;color:#475569}.empty{color:var(--muted);font-size:13px}
    .footer{text-align:center;color:var(--muted);font-size:11px;padding:22px 0 8px}
    @media(max-width:980px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.stages{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.topbar{padding:18px}.truth{display:none}.shell{padding:14px}.metrics{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.hero h2{font-size:22px}.stages{grid-template-columns:1fr 1fr}.artifacts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="mark">LD</div><div><h1>LocalDesk Agent</h1><p>Controlled Office Agent · Execution Console</p></div></div><div class="truth">只读 UI · 数据来自 Task Trace</div></header>
  <main class="shell">
    <section class="metrics" id="metrics"></section>
    <nav class="run-tabs" id="run-tabs" aria-label="Demo runs"></nav>
    <section class="panel hero" id="hero"></section>
    <section class="stages" id="stages"></section>
    <div class="grid">
      <div>
        <section class="panel" id="plan-panel"></section>
        <section class="panel" style="margin-top:18px" id="artifact-panel"></section>
      </div>
      <section class="panel" id="trace-panel"></section>
    </div>
    <div class="footer">LocalDesk 不会自动发送邮件；录制回放会明确标记，不冒充实时执行。</div>
  </main>
  <script id="localdesk-data" type="application/json">__LOCALDESK_DATA__</script>
  <script>
    const data=JSON.parse(document.getElementById('localdesk-data').textContent);let activeRun=0;let activeFilter='all';document.title=data.title||document.title;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const base=v=>String(v??'').split(/[\\/]/).pop();
    const labels={task_created:'接收用户任务',main_agent_planned:'Main Agent 生成计划',weekly_live_research_completed:'完成官方来源研究',weekly_briefing_started:'启动三路研究',research_agent_finished:'研究职责完成',editor_finished:'Editor 完成选题',weekly_briefing_reviewed:'Reviewer 与版式检查',reimbursement_analyzed:'完成报销核对',reimbursement_xlsx_staged:'生成异常工作簿',reimbursement_summary_staged:'生成 PDF 与邮件草稿',plan_created:'Runtime 创建交付计划',confirmation:'用户确认',artifact_bundle_preflight_passed:'交付前完整性预检',tool_requested:'请求工具',tool_policy_decided:'Policy Guard 决策',tool_completed:'工具执行完成',tool_verified:'Verification 通过',artifact_committed:'正式产物交付',status_changed:'任务状态变化',weekly_live_research_failed:'真实研究失败'};
    const group=e=>e.event_type.includes('artifact')?'artifact':e.event_type.startsWith('tool_')||['confirmation','plan_created','status_changed'].includes(e.event_type)?'runtime':e.event_type.includes('research')||e.event_type.includes('editor')||e.event_type.includes('review')||e.event_type.includes('agent')||e.event_type.includes('reimbursement')?'agent':'all';
    const summary=e=>{const p=e.payload||{};if(e.event_type==='status_changed')return `${p.from} → ${p.to}`;if(e.event_type==='main_agent_planned')return `${p.intent} · ${p.steps?.length||0} 步 · ${p.planner}`;if(e.event_type==='research_agent_finished')return `${p.agent} · ${p.card_count} 张卡片`;if(e.event_type==='editor_finished')return `${p.input_cards} → ${p.selected_cards} 张入选`;if(e.event_type==='reimbursement_analyzed')return `正常 ${p.matched_count} · 待复核 ${p.flagged_count}`;if(e.event_type==='confirmation')return p.approved?'用户已批准交付':'用户拒绝交付';if(e.event_type==='artifact_committed')return `${String(p.kind||'').toUpperCase()} · ${base(p.final_path)}`;if(e.event_type.startsWith('tool_'))return `${p.tool||''} · ${p.action_id||''}`;if(e.event_type==='weekly_live_research_completed')return `Feed ${p.feed_read_count||0} · Evidence ${p.article_read_count||0}`;return Object.keys(p).slice(0,3).map(k=>`${k}: ${typeof p[k]==='object'?'…':p[k]}`).join(' · ')};
    const stageDefs=[['理解任务',['task_created','main_agent_planned']],['资料处理',['weekly_live_research_completed','research_agent_finished','reimbursement_analyzed']],['生成产物',['weekly_briefing_reviewed','reimbursement_summary_staged']],['交付计划',['plan_created']],['人工确认',['confirmation']],['验证交付',['artifact_bundle_preflight_passed','artifact_committed']]];
    function renderMetrics(){const m=data.metrics||{};const items=[['冻结任务',m.task_count?`${m.passed}/${m.task_count}`:'—'],['并行加速',m.parallel_speedup?`${m.parallel_speedup}×`:'—'],['Trace 完整率',m.trace_completeness_rate!=null?`${Math.round(m.trace_completeness_rate*100)}%`:'—'],['模型成本',m.cost_usd!=null?`$${m.cost_usd}`:'—']];document.getElementById('metrics').innerHTML=items.map(([k,v])=>`<div class="metric"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('')}
    function renderTabs(){document.getElementById('run-tabs').innerHTML=data.runs.map((r,i)=>`<button class="run-tab ${i===activeRun?'active':''}" data-run="${i}">${esc(r.label)}</button>`).join('');document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{activeRun=Number(b.dataset.run);activeFilter='all';render()})}
    function renderHero(r){const t=r.task;const replay=r.mode==='recorded_real_trace'?'Recorded real run':'Live local trace';document.getElementById('hero').innerHTML=`<div><div class="eyebrow">${esc(replay)} · ${esc(t.task_id)}</div><h2>${esc(r.label)}</h2><p class="query">“${esc(t.user_query)}”</p><div class="mode-note">${esc(r.source_note||'')}</div></div><div class="status ${esc(t.status)}">${esc(t.status)}</div>`}
    function renderStages(r){const types=new Set(r.events.map(e=>e.event_type));document.getElementById('stages').innerHTML=stageDefs.map(([name,events])=>`<div class="stage ${events.some(e=>types.has(e))?'done':''}">${esc(name)}</div>`).join('')}
    function renderPlan(r){const t=r.task;const planEvent=r.events.find(e=>e.event_type==='main_agent_planned');const steps=planEvent?.payload?.steps||[t.plan].filter(Boolean);const actions=t.actions||[];const confirm=r.events.find(e=>e.event_type==='confirmation');document.getElementById('plan-panel').innerHTML=`<h3>Plan & Approval</h3>${steps.length?`<ol class="plan">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'<p class="empty">该历史任务没有 Main Agent 步骤记录。</p>'}<div class="actions" style="margin-top:14px">${actions.map(a=>`<div class="action"><div class="action-top"><span>${esc(a.summary)}</span><span>${esc(a.kind)}</span></div><small>${esc(a.skill)} · ${a.requires_confirmation?'需要确认':'无需确认'}</small></div>`).join('')}</div><div class="approval ${confirm?.payload?.approved?'ok':''}">${confirm?confirm.payload.approved?'✓ 用户已确认，Runtime 才开始正式交付':'用户拒绝，未交付':'当前 Trace 中没有确认事件'}</div>`}
    function renderArtifacts(r){const artifacts=r.task.artifacts||[];const limits=r.known_limitations||[];document.getElementById('artifact-panel').innerHTML=`<h3>Artifacts & Evidence</h3><div class="artifacts">${artifacts.length?artifacts.map(a=>`<div class="artifact"><div class="type">${esc(a.kind)}</div><strong title="${esc(a.final_path||a.staged_path)}">${esc(base(a.final_path||a.staged_path))}</strong><code>${esc(String(a.sha256||'').slice(0,16))}…</code></div>`).join(''):'<p class="empty">没有正式交付产物。</p>'}</div>${limits.length?`<ul class="limitations">${limits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`}
    function renderTrace(r){const filters=[['all','全部'],['agent','Agent / Workflow'],['runtime','Runtime'],['artifact','Artifact']];const events=activeFilter==='all'?r.events:r.events.filter(e=>group(e)===activeFilter);document.getElementById('trace-panel').innerHTML=`<div class="trace-head"><h3>Trace Timeline · ${r.events.length}</h3><div class="filters">${filters.map(([id,name])=>`<button class="filter ${id===activeFilter?'active':''}" data-filter="${id}">${name}</button>`).join('')}</div></div><div class="timeline">${events.map(e=>`<article class="event"><div class="seq">${esc(e.sequence)}</div><div><div class="event-title">${esc(labels[e.event_type]||e.event_type)}</div><div class="event-time">${esc(e.timestamp)}</div><div class="event-summary">${esc(summary(e))}</div><details><summary>查看原始 Trace payload</summary><pre>${esc(JSON.stringify(e.payload||{},null,2))}</pre></details></div></article>`).join('')}</div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;renderTrace(r)})}
    function renderEmpty(){document.getElementById('run-tabs').innerHTML='';document.getElementById('hero').innerHTML='<div><div class="eyebrow">Ready</div><h2>还没有可展示的任务</h2><p class="query">完成一次任务后，这里会显示 Plan、Approval、Artifact 和 Trace。</p></div><div class="status draft">empty</div>';document.getElementById('stages').innerHTML=stageDefs.map(([name])=>`<div class="stage">${esc(name)}</div>`).join('');document.getElementById('plan-panel').innerHTML='<h3>Plan & Approval</h3><p class="empty">等待任务。</p>';document.getElementById('artifact-panel').innerHTML='<h3>Artifacts & Evidence</h3><p class="empty">等待任务产物。</p>';document.getElementById('trace-panel').innerHTML='<h3>Trace Timeline · 0</h3><p class="empty">等待 Trace 事件。</p>'}
    function render(){if(!data.runs.length){renderEmpty();return}const r=data.runs[activeRun];renderTabs();renderHero(r);renderStages(r);renderPlan(r);renderArtifacts(r);renderTrace(r)}
    renderMetrics();render();
  </script>
</body>
</html>
